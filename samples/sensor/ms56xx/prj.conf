# Enable MS56XX pressure sensor
CONFIG_SENSOR=y
CONFIG_MS56XX=y

# Enable I2C (update if using SPI)
CONFIG_I2C=y

# Optional: Enable higher logging level for debugging
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# Console and printing
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use default 4096 oversampling or override with Kconfig
CONFIG_MS56XX_PRES_OVER_4096X=y
CONFIG_MS56XX_TEMP_OVER_4096X=y
CONFIG_SHELL=y
CONFIG_UART_SHELL=y
CONFIG_I2C_SHELL=y
